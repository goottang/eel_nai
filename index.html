<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>( ◜𖥦◝ ) HAPPY EEL</title>
     <link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script>
(function(){try{var t=localStorage.getItem('gal.theme');if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t}catch(e){}})();
</script>
<style>
:root{
  --bg:#f6f6f8;--surface:#fff;--surface2:#f0f0f4;--text:#17171c;--sub:#6a6a78;--line:#e3e3ea;
  --accent:#4f46e5;--accent-fg:#fff;--accent-soft:rgba(79,70,229,.12);--danger:#d92d20;
  --shadow:0 1px 2px rgba(20,20,40,.05),0 6px 24px rgba(20,20,40,.06);--ov:rgba(15,15,25,.55);
}
:root[data-theme=dark]{
  --bg:#0d0d11;--surface:#16161c;--surface2:#1f1f27;--text:#ededf2;--sub:#9a9aa8;--line:#2a2a34;
  --accent:#8f89ff;--accent-fg:#0d0d11;--accent-soft:rgba(143,137,255,.16);--danger:#ff6b61;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35);--ov:rgba(0,0,0,.66);
}
*{box-sizing:border-box}
html{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Pretendard Variable',Pretendard,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}

.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{max-width:1280px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brandwrap{margin-right:auto;min-width:0;flex:1 1 260px}
.brand{font-size:20px;font-weight:800;letter-spacing:-.02em}
.brand small{font-weight:500;color:var(--sub);font-size:13px;margin-left:8px;letter-spacing:0}
.dirbar{display:flex;align-items:center;gap:6px;margin-top:8px;min-width:0}
.dirlbl{font-size:12.5px;font-weight:700;color:var(--sub);white-space:nowrap}
.dirfield{height:32px;line-height:30px;padding:0 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--sub);font-size:13px;min-width:0;max-width:360px;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dirfield.on{color:var(--text);font-weight:600}
.ctx{position:fixed;z-index:120;min-width:200px;padding:6px;border-radius:14px;background:var(--surface);border:1px solid var(--line);box-shadow:0 10px 40px rgba(0,0,0,.28);display:flex;flex-direction:column;animation:pop .12s ease-out;transform-origin:top left}
.ctx::before{content:'';position:absolute;left:14px;top:-7px;width:12px;height:12px;background:var(--surface);border-left:1px solid var(--line);border-top:1px solid var(--line);transform:rotate(45deg)}
.ctx.up::before{top:auto;bottom:-7px;transform:rotate(225deg)}
.ctx button{position:relative;text-align:left;border:0;background:none;padding:10px 12px;border-radius:9px;font-size:14px;font-weight:600}
.ctx button:hover{background:var(--surface2)}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s,transform .05s}
.btn:hover:not(:disabled){background:var(--surface2)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.08)}
.btn.danger{color:var(--danger)}
.btn.sm{height:32px;padding:0 11px;font-size:13px;border-radius:8px}
.btn.icon{width:38px;padding:0}
.btn svg{width:18px;height:18px}

.wrap{max-width:1280px;margin:0 auto;padding:18px 20px 60px}
.notice{display:flex;align-items:flex-start;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:14px;font-size:14px;line-height:1.6}
.notice .nt{flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere}
.notice .nt.empty{color:var(--sub);font-weight:300}
.notice .nl{flex:none;font-size:12px;font-weight:600;color:var(--sub);padding-top:2px}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px}
.chip .n{font-weight:500;color:var(--sub);font-size:12.5px}
.chip:hover{background:var(--surface2)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip.on .n{color:inherit;opacity:.75}
.chip.ghost{border-style:dashed;background:transparent;color:var(--sub)}
.tg{height:34px;padding:0 14px;border-radius:999px;border:2px solid transparent;background:var(--tc);color:#2a2a33;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px;opacity:.6;transition:opacity .12s}
.tg:hover{opacity:.88}
.tg.on{opacity:1;border-color:var(--text);font-weight:800}
.tg .n{font-weight:500;font-size:12.5px;opacity:.7}
.tgs{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;background:var(--tc);color:#2a2a33;font-size:12px;font-weight:600}
.tagpick{display:flex;flex-wrap:wrap;gap:8px}
.bar2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.bar2[hidden]{display:none}
.bar2 .cnt{color:var(--sub);font-size:13.5px;font-weight:600;margin:0 6px}
.bar2 .sp{flex:1}
.hint2{font-size:12px;font-weight:300;color:var(--sub);opacity:.85;text-align:right;min-width:0}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(188px,1fr));gap:16px}
.card{padding:0;border:1px solid var(--line);background:var(--surface);border-radius:14px;overflow:hidden;text-align:left;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s;box-shadow:var(--shadow)}
.card:hover{transform:translateY(-3px)}
.card.sel{outline:3px solid var(--accent);outline-offset:-1px}
.thumb{position:relative;aspect-ratio:3/4;background:var(--surface2);overflow:hidden;cursor:pointer}
.thumb:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 28%;display:block}
.badge{position:absolute;right:8px;top:8px;height:24px;min-width:24px;padding:0 8px;border-radius:999px;background:rgba(10,10,16,.66);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;pointer-events:none}
.pendtag{position:absolute;right:8px;bottom:8px;height:22px;padding:0 9px;border-radius:999px;background:#ffb020;color:#2a1b00;font-size:11.5px;font-weight:800;display:flex;align-items:center;pointer-events:none}
.sqb{position:absolute;width:32px;height:32px;padding:0;border-radius:8px;border:2px solid rgba(255,255,255,.95);background:rgba(10,10,16,.42);color:#fff;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:background .15s,border-color .15s,color .15s}
.sqb svg{width:17px;height:17px}
.sqb:hover{background:rgba(10,10,16,.62)}
.sqb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sqb.chk{left:9px;top:9px;color:transparent}
.sqb.dlb{left:9px;bottom:9px}
.card.sel .sqb.chk,.ei.sel .sqb.chk{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.sqb.dlb.done{background:#a6e35c;border-color:#a6e35c;color:#1b2a07}
.sqb.dlb.done:hover{background:#b6ec72}
.meta{padding:10px 12px 12px;min-width:0;display:flex;flex-direction:column;gap:8px;flex:1}
.meta:empty{display:none}
.memo{font-weight:300;font-size:13.5px;line-height:1.5;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tagrow{display:flex;gap:5px;flex-wrap:wrap}
.editbtn{align-self:flex-start}
.eg{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:8px}
.ei{position:relative;border-radius:10px;overflow:hidden;background:var(--surface2)}
.ei img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.ei.sel{outline:3px solid var(--accent);outline-offset:-3px}
.trow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.trow .in{flex:1;min-width:150px}
.sw{display:flex;gap:5px}
.swb{width:24px;height:24px;border-radius:999px;border:2px solid transparent;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.swb.on{border-color:var(--text)}
.empty{padding:90px 20px;text-align:center;color:var(--sub)}
.empty b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}
.foot{max-width:1280px;margin:0 auto;padding:0 20px 40px;color:var(--sub);font-size:13px;display:flex;gap:14px;align-items:center}
.foot button{background:none;border:0;padding:0;color:var(--sub);text-decoration:underline;text-underline-offset:3px;font-size:13px}

/* overlays */
.ov{position:fixed;inset:0;z-index:50;background:var(--ov);display:flex;align-items:center;justify-content:center;padding:18px}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);width:min(1120px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.dlg.narrow{width:min(520px,100%)}
.dlg.mid{width:min(720px,100%)}
.dh{padding:18px 22px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.dh-row{display:flex;gap:10px;align-items:flex-start}
.m-title{font-size:19px;font-weight:800;letter-spacing:-.01em;flex:1;min-width:0;overflow-wrap:anywhere}
.m-memo{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text);background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:14px}
.x{margin-left:auto}
.in{width:100%;height:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);outline:none}
.in:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.in{height:auto;padding:9px 12px;resize:vertical;min-height:58px}
select.in{width:auto;min-width:140px}
.edit-row{display:flex;gap:8px;flex-wrap:wrap}
.edit-row .in.title{flex:1;min-width:180px}
.tb{padding:10px 22px;border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tb .cnt{color:var(--sub);font-size:13.5px;font-weight:600;margin:0 6px}
.tb .sp{flex:1}
.db{overflow:auto;padding:18px 22px 22px;flex:1}
.tag{position:absolute;right:9px;top:9px;height:22px;padding:0 8px;border-radius:999px;background:rgba(10,10,16,.66);color:#fff;font-size:11.5px;font-weight:700;display:flex;align-items:center;pointer-events:none}

.lb{background:rgba(5,5,10,.94);padding:0;border:0;border-radius:0;width:100%;height:100%;max-height:none;color:#fff;position:relative;align-items:center;justify-content:center}
.dlg.lb{background:transparent;box-shadow:none}
.ov.dark{background:rgba(5,5,10,.95)}
.lb-img{max-width:calc(100vw - 150px);max-height:calc(100vh - 110px);object-fit:contain;display:block;margin:auto}
.lb-bar{position:absolute;left:0;right:0;bottom:0;padding:14px 20px;display:flex;gap:12px;align-items:center;justify-content:center;font-size:13.5px;color:#d6d6e0;flex-wrap:wrap}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:999px;border:0;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center}
.lb-nav:hover{background:rgba(255,255,255,.24)}
.lb-nav svg{width:22px;height:22px}
.lb-close{position:absolute;right:16px;top:16px;width:44px;height:44px;border-radius:999px;border:0;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center}
.lb .btn{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
.lb.multi .lb-img{max-height:calc(100vh - 200px)}
.lb-strip[hidden],.lb-bar .btn[hidden]{display:none!important}
.lb-strip{position:absolute;left:0;right:0;bottom:64px;display:flex;gap:6px;align-items:center;justify-content:center;padding:0 12px}
.lb-th{width:56px;height:56px;padding:0;border:2px solid transparent;border-radius:8px;overflow:hidden;background:rgba(255,255,255,.1);opacity:.6;flex:none;transition:opacity .12s}
.lb-th:hover{opacity:.9}
.lb-th.on{opacity:1;border-color:#fff}
.lb-th img{display:block;width:100%;height:100%;object-fit:cover}
.lb-pg{width:32px;height:56px;border:0;border-radius:8px;background:rgba(255,255,255,.12);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.lb-pg:hover:not(:disabled){background:rgba(255,255,255,.24)}
.lb-pg:disabled{opacity:.3}
.lb-pg svg{width:18px;height:18px}
.lb-pgn{font-size:12px;color:#c9c9d4;margin-left:4px;flex:none}

.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:700;color:var(--sub)}
.hint{font-size:12.5px;color:var(--sub)}
.pad{padding:20px 22px;overflow:auto}
.df{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;align-items:center}
.df .msg{margin-right:auto;color:var(--sub);font-size:13px}
.drop{border:2px dashed var(--line);border-radius:14px;padding:26px;text-align:center;color:var(--sub);background:var(--surface2)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{color:var(--text)}
.flist{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin-top:14px}
.fi{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--surface2)}
.fi img{width:100%;height:100%;object-fit:cover;display:block}
.fi button{position:absolute;right:5px;top:5px;width:24px;height:24px;border-radius:999px;border:0;background:rgba(10,10,16,.7);color:#fff;font-size:15px;line-height:1;padding:0}
.fi .tag{left:5px;right:auto;top:5px}
.crow{display:flex;gap:6px;margin-bottom:8px;align-items:center}
.crow .in{flex:1}
.busy{position:fixed;inset:0;z-index:90;background:var(--ov);display:flex;align-items:center;justify-content:center}
.busy div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 28px;font-weight:600;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow);max-width:90vw}
.spin{width:20px;height:20px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:92vw}
.toast{background:#1c1c24;color:#fff;border-radius:12px;padding:11px 16px;font-size:14px;font-weight:500;box-shadow:0 8px 30px rgba(0,0,0,.3);pointer-events:auto}
.toast.err{background:#b42318}
:root[data-theme=dark] .toast{background:#ececf2;color:#111}
:root[data-theme=dark] .toast.err{background:#ff6b61;color:#1a0505}
@media (max-width:640px){
  .top-in{padding:12px 14px;gap:8px}.brandwrap{flex-basis:180px}.brand{font-size:18px;min-width:0;white-space:nowrap}.brand small{display:none}.dirfield{max-width:none;flex:1}
  .top .btn{padding:0 11px;font-size:13px}.top .btn.icon{padding:0;width:38px}
  .wrap{padding:14px 14px 50px}.grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .ov{padding:0}.dlg{border-radius:0;height:100%;width:100%}.dlg.narrow,.dlg.mid{height:auto;max-height:100%;margin-top:auto;border-radius:18px 18px 0 0}
  .dh,.tb,.db,.df,.pad{padding-left:14px;padding-right:14px}.tiles{columns:2 140px;column-gap:8px}.tile{margin-bottom:8px}
  .lb-img{max-width:100vw;max-height:calc(100vh - 150px)}.lb.multi .lb-img{max-height:calc(100vh - 270px)}.lb-nav{width:40px;height:40px}
  .lb-th{width:28px;height:40px}.lb-pg{width:22px;height:40px}.lb-pgn{display:none}.lb-strip{gap:3px;padding:0 6px;bottom:100px}.lb-bar{gap:8px;padding:12px 12px 14px}.lb-info{flex-basis:100%;text-align:center}
}
</style>
</head>
<body>
<header class="top"><div class="top-in" id="top"></div></header>
<main class="wrap">
  <div id="notice"></div>
  <nav class="cats" id="cats" aria-label="태그"></nav>
  <div class="bar2" id="bar"></div>
  <section id="grid"></section>
</main>
<footer class="foot" id="foot"></footer>
<div class="toasts" id="toasts"></div>

<script>
'use strict';
/* ───────── helpers ───────── */
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k in e) { try { e[k] = v; } catch { e.setAttribute(k, v); } }
    else e.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    e.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return e;
}
const svg = (d, extra = '') => { const s = document.createElement('span'); s.style.display = 'contents'; s.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ${extra}>${d}</svg>`; return s.firstChild; };
const ICON = {
  check: '<path d="M5 12.5l4.5 4.5L19 7.5" stroke-width="3"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  left: '<path d="M15 5l-7 7 7 7"/>', right: '<path d="M9 5l7 7-7 7"/>', close: '<path d="M6 6l12 12M18 6L6 18"/>',
  down: '<path d="M12 4v11M7.5 11l4.5 4.5 4.5-4.5M5 20h14"/>',
};
const sleep = ms => new Promise(r => setTimeout(r, ms));
const uid = () => Array.from(crypto.getRandomValues(new Uint8Array(6)), b => b.toString(36).padStart(2, '0')).join('').slice(0, 10);
const clone = o => JSON.parse(JSON.stringify(o));
const safeName = s => String(s || 'file').replace(/[\\/:*?"<>|\u0000-\u001f]/g, '_').slice(0, 120);
const fmtSize = n => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';

function toast(msg, { err = false, sticky = false } = {}) {
  const t = h('div', { class: 'toast' + (err ? ' err' : '') }, msg);
  $('#toasts').append(t);
  const api = { set: m => { t.textContent = m; }, close: () => t.remove() };
  if (!sticky) setTimeout(api.close, err ? 6500 : 3200);
  return api;
}

/* ───────── state ───────── */
const TAG_COLORS = [
  { k: 'pink', n: '분홍', c: '#ffc2d6' }, { k: 'peach', n: '살구', c: '#ffd5b0' }, { k: 'yellow', n: '노랑', c: '#fff0a3' },
  { k: 'green', n: '초록', c: '#c8ecb3' }, { k: 'sky', n: '하늘', c: '#bde0ff' }, { k: 'purple', n: '보라', c: '#dacbff' }, { k: 'mint', n: '민트', c: '#b3ece0' },
];
const emptyData = () => ({ version: 2, notice: '', tags: [], posts: [] });
function loadCfg() { try { return JSON.parse(localStorage.getItem('gal.cfg')) || {}; } catch { return {}; } }

      if (!force) {

      }

}

        pages > 1 && h('span', { class: 'lb-pgn' }, `${pg + 1}/${pages}`));
    };
    const show = (np, k) => {
      pi = np; i = k; pg = Math.floor(i / PER);
      const p = cur(), im = p.images[i];
      img.src = fileUrl(im.path); img.alt = im.name;
      info.textContent = `${many ? `게시물 ${pi + 1}/${list.length} · ` : ''}${p.images.length > 1 ? `${i + 1}/${p.images.length} · ` : ''}${im.name}${im.w ? ` · ${im.w}×${im.h}` : ''} · ${fmtSize(im.size || 0)}`;
      drawStrip();
    };
    /* step = +1 / -1 across images, then across posts (wraps around at the ends) */
    const step = d => {
      let np = pi, k = i + d;
      if (k >= list[np].images.length) { np = (np + 1) % list.length; k = 0; }
      else if (k < 0) { np = (np - 1 + list.length) % list.length; k = list[np].images.length - 1; }
      show(np, k);
    };
    img.addEventListener('error', () => { const u = rawUrl(cur().images[i].path); if (u && img.src !== u) img.src = u; });
    show(pi, i);
    const nav = (cls, icon, d, lab) => h('button', { class: 'lb-nav', style: cls, 'aria-label': lab, onclick: e => { e.stopPropagation(); step(d); } }, svg(icon));
    const moreThanOne = total() > 1;
    box.append(img, moreThanOne && nav('left:16px', ICON.left, -1, '이전'), moreThanOne && nav('right:16px', ICON.right, 1, '다음'),
      h('button', { class: 'lb-close', 'aria-label': '닫기', onclick: () => o.close() }, svg(ICON.close)), strip, h('div', { class: 'lb-bar' }, info, dl, dlAll));
    o.onkey = e => { if (!moreThanOne) return; if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'ArrowRight') step(1); };
    box.addEventListener('mousedown', e => { if (e.target === box) o.close(); });
  }, 'lb');
}

/* ───────── upload modal ───────── */
function openUpload() {
  const files = [];
  const picked = new Set(S.filter);
  openOverlay((box, o) => {
    const list = h('div', { class: 'flist' });
    const memo = h('textarea', { class: 'in', placeholder: '짧은 메모 (선택)', maxLength: 300, rows: 2 });
    const go = h('button', { class: 'btn primary', disabled: true }, '업로드');
    const info = h('span', { class: 'msg' }, '이미지를 추가하세요');
    const draw = () => {
      list.replaceChildren(...files.map((f, i) => h('div', { class: 'fi' }, h('img', { src: f.url, alt: '' }), i === 0 && h('span', { class: 'tag' }, '썸네일'), h('button', { type: 'button', 'aria-label': '제거', onclick: () => { URL.revokeObjectURL(f.url); files.splice(i, 1); draw(); } }, '×'))));
      go.disabled = !files.length;
      info.textContent = files.length ? `${files.length}장 · ${fmtSize(files.reduce((a, f) => a + f.file.size, 0))} · 맨 앞 이미지가 썸네일이 돼요` : '이미지를 추가하세요';
    };
    const add = fs => { for (const f of fs) if (/^image\/(png|jpeg|webp|gif)$/.test(f.type)) files.push({ file: f, url: URL.createObjectURL(f) }); draw(); };
    const input = h('input', { type: 'file', accept: 'image/png,image/jpeg,image/webp,image/gif', multiple: true, style: 'display:none', onchange: e => { add([...e.target.files]); e.target.value = ''; } });
    const drop = h('div', { class: 'drop' }, h('b', null, '이미지를 끌어다 놓거나'), ' ', h('button', { class: 'btn sm', type: 'button', onclick: () => input.click() }, '파일 선택'), h('div', { class: 'hint', style: 'margin-top:8px' }, 'NovelAI 원본 파일을 그대로 올려야 메타데이터가 유지돼요 (PNG 권장)'), input);
    ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
    ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
    drop.addEventListener('drop', e => add([...e.dataTransfer.files]));
    go.onclick = async () => {
      const ok = await createPost({ memo: memo.value.trim(), tags: [...picked], files: files.map(f => f.file) });
      if (ok) { files.forEach(f => URL.revokeObjectURL(f.url)); o.close(); }
    };
    box.append(
      h('div', { class: 'dh' }, h('div', { class: 'dh-row' }, h('h2', { class: 'm-title' }, '새 게시물'), h('button', { class: 'btn sm icon x', 'aria-label': '닫기', onclick: () => o.close() }, svg(ICON.close)))),
      h('div', { class: 'pad' }, drop, list, h('div', { style: 'height:16px' }),
        h('div', { class: 'field' }, h('label', null, '태그'), tagPicker(picked)), h('div', { class: 'field' }, h('label', null, '메모'), memo)),
      h('div', { class: 'df' }, info, h('button', { class: 'btn', onclick: () => o.close() }, '취소'), go));
  }, 'mid');
}

/* ───────── category manager ───────── */
function openTagManager() {
  const draft = clone(S.data.tags);
  let nc = TAG_COLORS[draft.length % TAG_COLORS.length].k;
  openOverlay((box, o) => {
    const rows = h('div'); const nw = h('input', { class: 'in', placeholder: '새 태그 이름', maxLength: 30 });
    const newSw = h('div', { class: 'sw' });
    const swatches = (cur, set) => TAG_COLORS.map(c => h('button', { type: 'button', class: 'swb' + (cur === c.k ? ' on' : ''), title: c.n, 'aria-label': c.n, style: `background:${c.c}`, onclick: () => set(c.k) }));
    const drawNew = () => newSw.replaceChildren(...swatches(nc, k => { nc = k; drawNew(); }));
    const draw = () => rows.replaceChildren(...draft.map((t, i) => h('div', { class: 'trow' },
      h('input', { class: 'in', value: t.name, maxLength: 30, oninput: e => { t.name = e.target.value; } }),
      h('div', { class: 'sw' }, swatches(t.color, k => { t.color = k; draw(); })),
      h('button', { class: 'btn sm icon', type: 'button', disabled: i === 0, 'aria-label': '위로', onclick: () => { [draft[i - 1], draft[i]] = [draft[i], draft[i - 1]]; draw(); } }, svg(ICON.left, 'style="transform:rotate(90deg)"')),
      h('button', { class: 'btn sm icon', type: 'button', disabled: i === draft.length - 1, 'aria-label': '아래로', onclick: () => { [draft[i + 1], draft[i]] = [draft[i], draft[i + 1]]; draw(); } }, svg(ICON.right, 'style="transform:rotate(90deg)"')),
      h('button', { class: 'btn sm danger', type: 'button', onclick: () => { const n = S.data.posts.filter(p => p.tags.includes(t.id)).length; if (!n || confirm(`“${t.name}” 태그가 붙은 ${n}개 게시물에서 이 태그가 빠져요. 삭제할까요?`)) { draft.splice(i, 1); draw(); } } }, '삭제'))));
    const addNew = () => { const v = nw.value.trim(); if (!v) return; draft.push({ id: uid(), name: v, color: nc }); nw.value = ''; nc = TAG_COLORS[draft.length % TAG_COLORS.length].k; drawNew(); draw(); };
    nw.addEventListener('keydown', e => { if (e.key === 'Enter') addNew(); });
    draw(); drawNew();
    box.append(
      h('div', { class: 'dh' }, h('div', { class: 'dh-row' }, h('h2', { class: 'm-title' }, '태그 관리'), h('button', { class: 'btn sm icon x', 'aria-label': '닫기', onclick: () => o.close() }, svg(ICON.close)))),
      h('div', { class: 'pad' }, h('div', { class: 'trow' }, nw, newSw, h('button', { class: 'btn sm', type: 'button', onclick: addNew }, '추가')), h('div', { style: 'height:8px' }), rows,
        h('p', { class: 'hint' }, '태그는 새 게시물을 올릴 때, 또는 카드의 “편집”에서 붙일 수 있어요.')),
      h('div', { class: 'df' }, h('button', { class: 'btn', onclick: () => o.close() }, '취소'), h('button', { class: 'btn primary', onclick: async () => {
        const cleaned = draft.map(t => ({ id: t.id, name: t.name.trim(), color: t.color })).filter(t => t.name);
        const ids = new Set(cleaned.map(t => t.id));
        if (await saveData(d => { d.tags = cleaned; d.posts.forEach(p => { p.tags = (p.tags || []).filter(id => ids.has(id)); }); }, '태그 수정')) o.close();
      } }, '저장')));
  }, 'mid');
}

/* ───────── admin settings ───────── */
function openSettings() {
  const guess = inferRepo();
  openOverlay((box, o) => {
    const owner = h('input', { class: 'in', value: S.cfg.owner || guess.owner || '', placeholder: 'GitHub 아이디' });
    const repo = h('input', { class: 'in', value: S.cfg.repo || guess.repo || '', placeholder: '저장소 이름' });
    const token = h('input', { class: 'in', type: 'password', value: S.cfg.token || '', placeholder: 'github_pat_…', autocomplete: 'off' });
    const msg = h('span', { class: 'msg' });
    const ok = h('button', { class: 'btn primary', onclick: async () => {
      const cfg = { owner: owner.value.trim(), repo: repo.value.trim(), token: token.value.trim() };
      if (!cfg.owner || !cfg.repo || !cfg.token) { msg.textContent = '세 칸을 모두 채워 주세요'; return; }
      ok.disabled = true; msg.textContent = '확인 중…';
      const prev = S.cfg; S.cfg = cfg;
      try {
        const r = await gh(repoPath());
        if (!(r.permissions && r.permissions.push)) throw new Error('이 토큰에는 쓰기 권한이 없어요. Contents: Read and write를 선택하세요.');
        S.cfg.branch = r.default_branch; saveCfg(); S.admin = true;
        await loadFromApi(); o.close(); renderAll(); toast('관리자로 연결됐어요');
      } catch (e) { S.cfg = prev; msg.textContent = e.message; ok.disabled = false; }
    } }, '연결');
    box.append(
      h('div', { class: 'dh' }, h('div', { class: 'dh-row' }, h('h2', { class: 'm-title' }, '관리자 연결'), h('button', { class: 'btn sm icon x', 'aria-label': '닫기', onclick: () => o.close() }, svg(ICON.close)))),
      h('div', { class: 'pad' },
        h('div', { class: 'field' }, h('label', null, 'GitHub 아이디'), owner), h('div', { class: 'field' }, h('label', null, '저장소 이름'), repo),
        h('div', { class: 'field' }, h('label', null, 'Personal access token (fine-grained)'), token,
          h('span', { class: 'hint' }, '이 저장소 하나만 선택하고 Contents: Read and write 권한만 주세요. 토큰은 이 브라우저에만 저장되고 GitHub 외에는 전송되지 않아요. 공용 PC에서는 사용하지 마세요.'))),
      h('div', { class: 'df' }, msg, h('button', { class: 'btn', onclick: () => o.close() }, '취소'), ok));
  }, 'narrow');
}

/* ───────── boot ───────── */
(async function boot() {
  if (HAS_DIR) dirHandle = await idbGet('dir');
  renderAll();
  try {
    if (S.admin) { try { await loadFromApi(); } catch (e) { toast('관리자 연결 실패: ' + e.message + ' (공개 데이터로 표시)', { err: true }); } }
    if (!S.admin || !S.headSha) {
      const r = await fetch('data.json', { cache: 'no-store' });
      if (r.ok) S.data = normalize(await r.json()); else if (r.status !== 404) throw new Error('HTTP ' + r.status);
    }
  } catch (e) { S.loadErr = location.protocol === 'file:' ? '파일로 직접 열면 동작하지 않아요. GitHub Pages 주소로 접속하세요.' : String(e.message || e); }
  if (!S.committed) S.committed = clone(S.data);
  renderAll();
  /* one-time: write the old categories back as tags */
  if (S.admin && S.headSha && S.migrated) { S.migrated = false; await saveData(() => {}, '태그 변환'); await saveAll(); }
})();
</script>
